<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="View the SG Games Darby page.">
<script src="/js/mimicry.js" defer></script>
    <title>Darby</title>
    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #000;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .darby-stage {
            flex: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #000;
        }

        .darby-image {
            width: min(100vw, 1200px);
            height: min(100vh, 900px);
            object-fit: contain;
            display: block;
            opacity: 0;
            transform: scale(0.72) rotate(-180deg);
            animation: darbyEntrance 2.2s cubic-bezier(0.2, 0.9, 0.18, 1) 0.2s forwards;
            will-change: opacity, transform;
        }

        @keyframes darbyEntrance {
            0% {
                opacity: 0;
                transform: scale(0.72) rotate(-180deg);
            }

            35% {
                opacity: 1;
            }

            72% {
                transform: scale(1.04) rotate(380deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .darby-image {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/master.css">
</head>
<body>
    <main class="darby-stage" aria-label="Darby">
        <img class="darby-image" src="/darby/darby.png" alt="Darby">
    </main>
    <footer>
        <p class="footer-company">&copy; 2026 SG Games. All rights reserved.</p>
        <p class="footer-owner">Owned and operated by Santiago Gutierrez.</p>
        <nav class="footer-links" aria-label="Footer">
            <a href="/legal/privacy-policy/">Privacy Policy</a>
            <span class="footer-separator" aria-hidden="true">|</span>
            <a href="/legal/terms-and-conditions/">Terms</a>
            <span class="footer-separator" aria-hidden="true">|</span>
            <a href="/legal/cookies/">Cookies</a>
            <span class="footer-separator" aria-hidden="true">|</span>
            <a href="/legal/about/">About</a>
            <span class="footer-separator" aria-hidden="true">|</span>
            <a href="/legal/contact/">Contact</a>
        </nav>
    </footer>
    <script src="/js/main.js" defer></script>
</body>
</html>
